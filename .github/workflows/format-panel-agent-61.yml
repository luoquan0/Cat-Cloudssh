name: Format Panel Agent .61

on:
  push:
    branches:
      - feat/panel-agent-shared-terminal-61
    paths:
      - src/backend/hosts/terminal/session-manager.ts
      - src/backend/panel-runtime/jobs.test.ts
      - src/backend/panel-runtime/jobs.ts
      - src/backend/panel-runtime/model.test.ts
      - src/ui/features/terminal/Terminal.tsx
      - src/ui/sidebar/PanelAgentPanel.tsx
      - src/ui/sidebar/RuntimePanelAgent.tsx
      - .github/workflows/format-panel-agent-61.yml

permissions:
  contents: write

concurrency:
  group: format-panel-agent-61
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style(agent): format .61 changes') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            src/backend/hosts/terminal/session-manager.ts \
            src/backend/panel-runtime/jobs.test.ts \
            src/backend/panel-runtime/jobs.ts \
            src/backend/panel-runtime/model.test.ts \
            src/ui/features/terminal/Terminal.tsx \
            src/ui/sidebar/PanelAgentPanel.tsx \
            src/ui/sidebar/RuntimePanelAgent.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/backend/hosts/terminal/session-manager.ts \
            src/backend/panel-runtime/jobs.test.ts \
            src/backend/panel-runtime/jobs.ts \
            src/backend/panel-runtime/model.test.ts \
            src/ui/features/terminal/Terminal.tsx \
            src/ui/sidebar/PanelAgentPanel.tsx \
            src/ui/sidebar/RuntimePanelAgent.tsx
          git commit -m "style(agent): format .61 changes"
          git push origin HEAD:feat/panel-agent-shared-terminal-61
