name: Agent terminal repair validation
on:
  push:
    branches:
      - fix/agent-terminal-stability-69
permissions:
  contents: read
concurrency:
  group: agent-terminal-repair-69
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect relevant source paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = {
            'src/ui/features/terminal/Terminal.tsx': ['agentTrace', 'agentControlState', 'writeAgentTrace'],
            'src/backend/hosts/terminal/index.ts': ['filterAgentRuntimeOutput'],
            'src/backend/database/database.ts': ['admin/settings', 'createUpdateRoutes'],
            'src/ui/sidebar/AdminSettings.tsx': ['AdminPanelAgentSection'],
            'src/backend/panel-runtime/jobs.test.ts': ['shared-terminal', 'acquireAgentRuntimeLease'],
          }
          for name, needles in targets.items():
            p = Path(name)
            if not p.exists():
              print('MISSING', name)
              continue
            lines = p.read_text().splitlines()
            spans = set()
            for i, line in enumerate(lines):
              if any(needle in line for needle in needles):
                spans.update(range(max(0, i-18), min(len(lines), i+65)))
            print('\nFILE', name)
            for i in sorted(spans): print(f'{i+1}: {lines[i]}')
          for folder in ['src/backend/database/routes', 'src/ui/sidebar', 'src/backend/panel-runtime']:
            print('PATHS', folder)
            for p in Path(folder).glob('*'):
              if any(s in p.name.lower() for s in ['admin', 'setting', 'job', 'policy', 'router']): print(p)
          PY
