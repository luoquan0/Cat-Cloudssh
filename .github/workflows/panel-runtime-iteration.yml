name: Validate backend Agent runtime
on:
  push:
    branches: [feat/backend-agent-runtime-57]
    paths: [.github/workflows/panel-runtime-iteration.yml]
permissions:
  contents: write
concurrency:
  group: panel-runtime-57-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      BASE_SHA: 350cc9e3b70295c0342080787e5a21ce984d3dd9
      PUBLISH_TESTED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Prepare reviewed source changes
        run: |
          set -euo pipefail
          node scripts/prepare-panel-runtime.mjs
          node scripts/wire-panel-runtime-ui.mjs
          node scripts/finalize-panel-runtime.mjs
          rm scripts/prepare-panel-runtime.mjs scripts/wire-panel-runtime-ui.mjs scripts/finalize-panel-runtime.mjs
          rm .github/workflows/panel-runtime-iteration.yml
          npm install --package-lock-only --ignore-scripts --save-exact openai@7.25.0 js-tiktoken@1.0.21
          echo 'Production Agent entry points:'
          grep -RIn --include='*.tsx' --exclude='*.test.tsx' 'PanelAgentPanel' src/ui | head -n 30
      - run: npm ci
      - name: Format changed sources
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" -- '*.ts' '*.tsx' '*.json' '*.yml' '*.md' '*.mjs' |
          while IFS= read -r file; do
            npx prettier --write "$file"
            npx prettier --write "$file"
          done
          git diff --check
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Formatting
        id: format
        continue-on-error: true
        run: npm run format:check
      - name: Backend types
        id: backend
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: No new frontend type errors against stable main
        id: frontend
        continue-on-error: true
        run: node scripts/check-frontend-type-regressions.mjs "$BASE_SHA"
      - name: All tests
        id: tests
        continue-on-error: true
        run: |
          if npm test > /tmp/tests.log 2>&1; then tail -n 12 /tmp/tests.log; else tail -n 180 /tmp/tests.log; exit 1; fi
      - name: Skill regressions
        id: skill
        continue-on-error: true
        run: npm run test:skill
      - name: Production build
        id: build
        continue-on-error: true
        run: |
          if npm run build > /tmp/build.log 2>&1; then tail -n 16 /tmp/build.log; else tail -n 100 /tmp/build.log; exit 1; fi
      - name: Require all checks
        env:
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          SKILL: ${{ steps.skill.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$LINT" "$FORMAT" "$BACKEND" "$FRONTEND" "$TESTS" "$SKILL" "$BUILD"; do test "$outcome" = success; done
      - name: Produce tested feature commit only
        if: env.PUBLISH_TESTED == 'true'
        run: |
          set -euo pipefail
          test -f src/ui/sidebar/RuntimePanelAgent.tsx
          test -f src/ui/tests/sidebar/RuntimePanelAgent.test.tsx
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          rm -rf .type-reports
          git add -A
          TREE="$(git write-tree)"
          export GIT_AUTHOR_NAME=Zerotwo617 GIT_COMMITTER_NAME=Zerotwo617
          export GIT_AUTHOR_EMAIL=289179459+Zerotwo617@users.noreply.github.com
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          COMMIT="$(git commit-tree "$TREE" -p "$BASE_SHA" -m 'feat(agent): backend runtime, isolated jobs and automatic context compaction (.57)')"
          git push --force-with-lease="refs/heads/feat/backend-agent-runtime-57:$GITHUB_SHA" origin "$COMMIT:refs/heads/feat/backend-agent-runtime-57"
          echo "TESTED_COMMIT=$COMMIT"
          echo "TESTED_TREE=$TREE"
